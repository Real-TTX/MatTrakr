name: Build & publish image

# Builds the Docker image and publishes it to the GitHub Container Registry
# (GHCR) as a package on every push to main / dev (and version tags).
on:
  push:
    branches: [main, dev]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and tags
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="${REGISTRY}/${owner}/mattrakr"
          majmin=$(tr -d '[:space:]' < VERSION)
          date=$(date -u +%Y%m%d)
          build="${{ github.run_number }}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version="${majmin}.${build}-${date}"
            tags="${image}:latest,${image}:${version}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            version="nightly-${build}-${date}"
            tags="${image}:nightly,${image}:${version}"
          else
            version="${GITHUB_REF_NAME}"
            tags="${image}:${version}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tags}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
